<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TexFi m0ney banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#18181f"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d94fb"/>
      <stop offset="100%" stop-color="#4a7dfb"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a7dfb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4a7dfb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#2a2a31" stroke-width="1"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="18" fill="#1a1a20"/>
  <rect x="0" y="26" width="1200" height="18" fill="#1a1a20"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="6" fill="#febc2e"/>
  <circle cx="72" cy="22" r="6" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#8b8b95">money — TexFi m0ney</text>

  <!-- growth glyph (echoes the app icon) -->
  <g transform="translate(1000,110)">
    <rect x="0" y="66" width="18" height="18" rx="4" fill="#4a7dfb"/>
    <rect x="24" y="50" width="18" height="34" rx="4" fill="#4a7dfb"/>
    <rect x="48" y="34" width="18" height="50" rx="4" fill="#4a7dfb"/>
    <rect x="72" y="12" width="18" height="72" rx="4" fill="#6d94fb"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="160" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="64" font-weight="700" fill="#f2f2f4">TexFi <tspan fill="url(#accentText)">m0ney</tspan></text>

  <!-- cursor -->
  <rect x="524" y="112" width="14" height="52" fill="#4a7dfb">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="92" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" fill="#8b8b95">Track spending, budgets &amp; savings goals. Private, offline, yours.</text>

  <!-- prompt line -->
  <text x="92" y="246" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#6d94fb">$ <tspan fill="#c9c9ce">texfi balance</tspan></text>

  <!-- platform chips -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#c9c9ce">
    <rect x="90" y="270" width="104" height="28" rx="14" fill="#202026" stroke="#2a2a31"/>
    <text x="142" y="289" text-anchor="middle">Android</text>

    <rect x="204" y="270" width="96" height="28" rx="14" fill="#202026" stroke="#2a2a31"/>
    <text x="252" y="289" text-anchor="middle">Flutter</text>

    <rect x="310" y="270" width="140" height="28" rx="14" fill="#202026" stroke="#2a2a31"/>
    <text x="380" y="289" text-anchor="middle">Offline-first</text>
  </g>
</svg>
