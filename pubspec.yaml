name: texfi_money
description: "TexFi m0ney — личный финансовый трекер"
publish_to: 'none'

version: 0.7.1+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3

  # UI / UX
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^13.3.0
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  drift_dev: ^2.23.1
  build_runner: ^2.4.15

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0d0d10"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0d0d10"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0d0d10"
    image: assets/icon/splash_logo.png
