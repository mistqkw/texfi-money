name: texfi_money
description: "TexFi m0ney — личный финансовый трекер"
publish_to: 'none'

version: 1.2.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3

  # UI / UX
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^13.3.0
  file_picker: ^12.1.2
  image_picker: ^1.2.3
  local_auth: ^3.0.2

  # Экран «О приложении»: номер версии берётся из самой сборки, а не
  # дублируется константой в коде — константа неизбежно разъезжается
  # с pubspec ровно в тот релиз, когда это заметят пользователи.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  drift_dev: ^2.23.1
  build_runner: ^2.4.15

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Шрифты лежат в сборке, а не тянутся по сети. m0ney — офлайн-приложение:
    # на свежей установке без интернета google_fonts не успевал (и мог никогда
    # не успеть) скачать гарнитуру, и весь интерфейс — включая пиксельные
    # заголовки — рисовался системным Roboto. Стиль, который виден только
    # при наличии сети, — это не стиль.
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Бета-стиль из меню разработчика: заголовки и крупные числа —
    # антиква вместо пикселя. Кириллица и латиница покрыты полностью.
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600

  assets:
    - assets/icon/
    # Пусто по умолчанию: приложение рисует собственные знаки банков.
    # Настоящие логотипы можно положить сюда — см. assets/banks/README.md.
    - assets/banks/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0d0d10"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0d0d10"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0d0d10"
    image: assets/icon/splash_logo.png
